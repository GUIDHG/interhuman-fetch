name: fetch-interhuman

# Runs on a GitHub-hosted runner because this project's network cannot reach
# drive.google.com at all (TCP 443 blocked), while github.com is reachable.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only fetch the first N clips (0 = all)"
        required: false
        default: "0"
      workers:
        description: "Parallel Drive connections"
        required: false
        default: "4"

permissions:
  contents: read

defaults:
  run:
    working-directory: interhuman-fetch

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet requests

      - name: Select clips
        id: select
        shell: bash
        run: |
          limit="${{ github.event.inputs.limit }}"
          if [ "$limit" = "0" ] || [ -z "$limit" ]; then
            cp boxing_clips.txt selected.txt
          else
            head -n "$limit" boxing_clips.txt > selected.txt
          fi
          echo "count=$(wc -l < selected.txt)" >> "$GITHUB_OUTPUT"

      - name: Dry run
        run: |
          python download_interhuman.py \
            --profile profiles/interhuman.json \
            --ids-file selected.txt \
            --output out \
            --dry-run

      - name: Download and verify md5
        shell: bash
        run: |
          set -o pipefail
          python download_interhuman.py \
            --profile profiles/interhuman.json \
            --ids-file selected.txt \
            --output out \
            --workers "${{ github.event.inputs.workers }}" \
            --retries 6 2>&1 | tee fetch.log

      - name: Package
        if: always()
        shell: bash
        run: |
          tar -czf "interhuman-boxing-${{ steps.select.outputs.count }}.tar.gz" -C out .
          ls -lh ./*.tar.gz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interhuman-boxing
          path: |
            interhuman-fetch/interhuman-boxing-*.tar.gz
            interhuman-fetch/fetch.log
          retention-days: 30
          compression-level: 0
