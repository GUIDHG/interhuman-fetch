name: fetch-interhuman

# Runs on a GitHub-hosted runner because this project's network cannot reach
# drive.google.com at all (TCP 443 blocked), while the runner can.
# The downloaded clips are committed into data/ so collaborators can simply
# clone this private repository instead of talking to Google Drive.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only fetch the first N clips (0 = all)"
        required: false
        default: "0"
      workers:
        description: "Parallel Drive connections"
        required: false
        default: "6"

permissions:
  contents: write

defaults:
  run:
    working-directory: interhuman-fetch

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet requests

      - name: Select clips
        id: select
        shell: bash
        run: |
          limit="${{ github.event.inputs.limit }}"
          if [ "$limit" = "0" ] || [ -z "$limit" ]; then
            cp boxing_clips.txt selected.txt
          else
            head -n "$limit" boxing_clips.txt > selected.txt
          fi
          echo "count=$(wc -l < selected.txt)" >> "$GITHUB_OUTPUT"

      - name: Download and verify md5
        shell: bash
        run: |
          set -o pipefail
          python download_interhuman.py \
            --profile profiles/interhuman.json \
            --ids-file selected.txt \
            --output out \
            --workers "${{ github.event.inputs.workers }}" \
            --retries 6 2>&1 | tee fetch.log

      - name: Commit clips into data/
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          cp -r interhuman-fetch/out/motions interhuman-fetch/out/annots interhuman-fetch/out/split data/
          cp interhuman-fetch/out/fetch-report.json data/ 2>/dev/null || true
          git add data
          if git diff --cached --quiet; then
            echo "no new clips to commit"
          else
            git commit -m "Add ${{ steps.select.outputs.count }} InterHuman clips"
            git push
          fi

      - name: Package fallback artifact
        if: failure()
        working-directory: ${{ github.workspace }}
        run: tar -czf interhuman-boxing.tar.gz -C interhuman-fetch/out .

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: interhuman-boxing-fallback
          path: |
            interhuman-boxing.tar.gz
            interhuman-fetch/fetch.log
          retention-days: 7
          compression-level: 0
